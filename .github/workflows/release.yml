name: release

on:
  push:
    tags:
      - 'v*.*.*'

# Default: read-only. Jobs raise permissions explicitly where needed.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # gh run list braucht actions:read; Top-Level contents:read allein liefert 403.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Tag must be on main and CI green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-list -n 1 "${GITHUB_REF}")"
          git fetch origin main
          chmod +x scripts/check-release-gate.sh
          ./scripts/check-release-gate.sh "${TAG_SHA}" "${GITHUB_REPOSITORY}"

      - name: Version from tag
        id: meta
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          V="${V#v}"
          echo "version=${V}" >> "${GITHUB_OUTPUT}"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build agent binaries
        env:
          AGENT_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/thelad-dev/ssh-sync/internal/version.Agent=${AGENT_VERSION}"
          build() {
            local goos="$1" goarch="$2" out="$3"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/${out}" ./cmd/agent
          }
          build linux amd64 ssh-sync-linux-amd64
          build linux arm64 ssh-sync-linux-arm64
          build windows amd64 ssh-sync-windows-amd64.exe
          build darwin amd64 ssh-sync-darwin-amd64
          build darwin arm64 ssh-sync-darwin-arm64
          ( cd dist && zip -j ssh-sync-windows-amd64.zip ssh-sync-windows-amd64.exe )
          ( cd dist && sha256sum ssh-sync-linux-amd64 ssh-sync-linux-arm64 \
              ssh-sync-windows-amd64.exe ssh-sync-windows-amd64.zip \
              ssh-sync-darwin-amd64 ssh-sync-darwin-arm64 > SHA256SUMS )

      - name: Upload dist
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: agent-dist
          path: dist/
          if-no-files-found: error

  # Keyless Sigstore signing + provenance. id-token and attestations only here.
  # Trusted identity (client constants only in internal/releaseverify/identity.go):
  #   issuer https://token.actions.githubusercontent.com
  #   subject ^https://github\.com/thelad-dev/ssh-sync/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$
  #   sourceRepositoryURI https://github.com/thelad-dev/ssh-sync
  #   sourceRepositoryOwnerURI https://github.com/thelad-dev
  sign:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dist
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: agent-dist
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build mkmanifest
        run: CGO_ENABLED=0 go build -trimpath -o bin/mkmanifest ./cmd/mkmanifest

      - name: Create manifest.json
        env:
          AGENT_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          ./bin/mkmanifest -version "${AGENT_VERSION}" -dir dist

      - name: Sign manifest with Sigstore (keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --bundle manifest.json.sigstore.json manifest.json --yes

      - name: Verify Sigstore bundle
        working-directory: dist
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle manifest.json.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/thelad-dev/ssh-sync/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            manifest.json

      # GitHub Attestations API is unavailable for user-owned private repos.
      # Skip on private; Cosign keyless + draft release do not depend on this step.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload signed dist
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: agent-dist-signed
          path: dist/
          if-no-files-found: error

  # Draft release only. contents: write stays off the signing job.
  # needs: sign (not the attest step); skipped attest must not block the draft.
  draft:
    needs: [gate, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed dist
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: agent-dist-signed
          path: dist

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ssh-sync-linux-amd64
            dist/ssh-sync-linux-arm64
            dist/ssh-sync-windows-amd64.exe
            dist/ssh-sync-windows-amd64.zip
            dist/ssh-sync-darwin-amd64
            dist/ssh-sync-darwin-arm64
            dist/SHA256SUMS
            dist/manifest.json
            dist/manifest.json.sigstore.json
          body: |
            Entwurf: vor dem Veroeffentlichen Sigstore-Bundle, SHA256SUMS und Manifest pruefen.
            Keyless-Identitaet: workflow release.yml am Tag (siehe docs/release.md).
